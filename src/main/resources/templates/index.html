<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen">

<div class="max-w-5xl mx-auto py-12 px-4">
    <h1 class="text-4xl font-extrabold text-center mb-10 text-gray-800 tracking-wide">
        F.Fundz Gallery
    </h1>

    <!-- Upload Form -->
    <form th:action="@{/add-image}" method="post" enctype="multipart/form-data"
          class="mb-12 bg-white/80 backdrop-blur-md p-6 rounded-xl shadow-lg border border-gray-200">
        <label class="block mb-3 text-gray-700 font-semibold">Upload New Image</label>
        <input type="file" name="file" required
               class="border border-gray-300 rounded-lg p-2 w-full mb-5 focus:ring focus:ring-blue-300">
        <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 transition text-white px-5 py-2 rounded-md font-medium shadow-md">
            Upload
        </button>
    </form>

    <!-- Message -->
    <p th:if="${message}" class="text-center text-gray-600 italic mb-8" th:text="${message}"></p>

    <!-- Gallery -->
    <div th:if="${images}" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5">
        <div th:each="image : ${images}" class="relative group overflow-hidden rounded-xl shadow hover:shadow-lg transition bg-white">
            <img th:src="${image.url}" alt="Photo"
                 class="object-cover w-full h-48 transform group-hover:scale-105 transition duration-300">

            <!-- Delete button -->
            <form th:action="@{/delete-image}" method="post"
                  class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition">
                <input type="hidden" name="id" th:value="${image.id}">
                <button type="submit"
                        class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-full px-2 py-1 shadow-md">
                    ✕
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
